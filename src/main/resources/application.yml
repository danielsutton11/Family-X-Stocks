spring:
  application:
    name: torn-stock-bot
  main:
    web-application-type: none
  datasource:
    # Railway's Postgres service exposes these variables; reference them on the bot service.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    hikari:
      # One scheduler thread plus the odd button press: two connections is plenty.
      maximum-pool-size: 2
      minimum-idle: 1
  flyway:
    enabled: true

bot:
  torn:
    api-key: ${TORN_API_KEY:}
  tornsy:
    backfill-enabled: ${TORNSY_BACKFILL:true}
    backfill-months: ${TORNSY_BACKFILL_MONTHS:12}
  discord:
    token: ${DISCORD_TOKEN:}
    # Channel holding the control panel (one embed with buttons).
    control-channel-id: ${DISCORD_CONTROL_CHANNEL_ID:}
    # Channel for buy and sell alerts, which ping the role below.
    alert-channel-id: ${DISCORD_ALERT_CHANNEL_ID:}
    alert-role-id: ${DISCORD_ALERT_ROLE_ID:1574038019638296647}
    # Your Discord user id: only this user can use Export data. Blank means server administrators.
    owner-id: ${DISCORD_OWNER_ID:}
  rotation:
    # Members follow this: hold the stocks furthest below their 4-week average, rebalanced every 3 days.
    lookback-hours: ${ROTATION_LOOKBACK_HOURS:672}
    every-hours: ${ROTATION_EVERY_HOURS:72}
    hold: ${ROTATION_HOLD:5}
    keep: ${ROTATION_KEEP:10}
    anchor-hour-utc: ${ROTATION_ANCHOR_HOUR_UTC:18}
  trading:
    # Paper dip strategy (kept for comparison). Share of its equity put into each new position.
    position-size: ${TRADING_POSITION_SIZE:0.10}
    # Never open a position smaller than this share of equity.
    min-position: ${TRADING_MIN_POSITION:0.02}

logging:
  level:
    net.dv8tion: WARN
    com.familyx: INFO
